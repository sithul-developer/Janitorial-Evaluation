<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F1BE48">
    <title>Employee Survey System-UAT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f7fa;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .fullscreen-wrapper {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #f5f7fa;
        }

        .fullscreen-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Loading screen shown while iframe initializes */
        .loader {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f5f7fa;
            gap: 16px;
            z-index: 10;
            transition: opacity 0.4s ease;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e8edf2;
            border-top: 4px solid #F1BE48;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            color: #5a7d98;
            font-size: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="fullscreen-wrapper">

        <!-- Loading overlay (auto-hides when iframe loads) -->
        <div class="loader" id="loader">
            <div class="loader-spinner"></div>
            <div class="loader-text">Loading Survey…</div>
        </div>

        <!--
            🔑 KEY FIX: allow="geolocation"
            Without this attribute, the browser blocks GPS requests
            coming from inside a cross-origin iframe.
        -->
        <iframe
            id="surveyFrame"
            class="fullscreen-iframe"
            src="https://script.google.com/macros/s/AKfycbzxdeYR9cTC5Xb-PudmUZOdxEohV-NFsGaeDVdi97mHfM7a-pDxOEF_qKZtTbD1fKqU4A/exec"
            allow="geolocation; camera; microphone; fullscreen"
            allowfullscreen
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>

    </div>

    <script>
        // Hide the loader once the iframe has loaded
        (function() {
            const frame = document.getElementById('surveyFrame');
            const loader = document.getElementById('loader');

            function hideLoader() {
                loader.classList.add('hidden');
                setTimeout(() => loader.remove(), 500);
            }

            // Hide when iframe finishes loading
            frame.addEventListener('load', hideLoader);

            // Safety fallback: hide after 4s regardless
            setTimeout(hideLoader, 4000);
        })();
    </script>

</body>
</html>
