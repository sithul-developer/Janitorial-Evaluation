<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F1BE48">
    <title>BVM Employee Survey System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f7fa;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .fullscreen-wrapper {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #f5f7fa;
        }

        .fullscreen-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ============================
           LOADER
        ============================ */
        .loader {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f5f7fa;
            gap: 16px;
            z-index: 10;
            transition: opacity 0.4s ease;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e8edf2;
            border-top: 4px solid #F1BE48;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            color: #5a7d98;
            font-size: 15px;
            font-weight: 500;
        }

        /* ============================
           TOP BANNER (Optional)
        ============================ */
        .top-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: linear-gradient(135deg, #006837, #004d28);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            border-bottom: 3px solid #FFD200;
            font-size: 14px;
            font-weight: 600;
        }

        .top-banner .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .top-banner .brand-icon {
            font-size: 18px;
        }

        .top-banner .page-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        .top-banner .page-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #FFD200;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .top-banner .logout-btn {
            background: #FFD200;
            color: #222;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .top-banner .logout-btn:hover {
            background: #e6bd00;
            transform: scale(0.97);
        }

        /* ============================
           IFRAME CONTAINER (Account for banner)
        ============================ */
        .iframe-container {
            position: absolute;
            top: 48px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }

        .iframe-container .fullscreen-iframe {
            width: 100%;
            height: 100%;
        }

        /* On login page - no banner */
        body.login-mode .top-banner {
            display: none;
        }

        body.login-mode .iframe-container {
            top: 0;
        }

        /* ============================
           MOBILE ADJUSTMENTS
        ============================ */
        @media (max-width: 480px) {
            .top-banner {
                height: 44px;
                padding: 0 12px;
                font-size: 12px;
            }

            .top-banner .brand-text {
                display: none;
            }

            .top-banner .page-indicator {
                font-size: 11px;
                padding: 3px 10px;
            }

            .iframe-container {
                top: 44px;
            }
        }
    </style>
</head>
<body class="login-mode">

    <!-- ============================
         TOP BANNER (Hidden in login mode)
    ============================ -->
    <div class="top-banner" id="topBanner">
        <div class="brand">
            <span class="brand-icon">📋</span>
            <span class="brand-text">BVM Employee Survey</span>
        </div>
        <div class="page-indicator">
            <span class="dot"></span>
            <span id="currentPageLabel">Survey</span>
        </div>
        <button class="logout-btn" onclick="logout()">
            🚪 <span>Logout</span>
        </button>
    </div>

    <div class="fullscreen-wrapper">
        <!-- Loading overlay -->
        <div class="loader" id="loader">
            <div class="loader-spinner"></div>
            <div class="loader-text" id="loaderText">Loading…</div>
        </div>

        <!-- Iframe -->
        <div class="iframe-container">
            <iframe
                id="surveyFrame"
                class="fullscreen-iframe"
                src="https://script.google.com/macros/s/AKfycbwSM25ObtDe_AwvXut2QqGjfc9-v-3I2xsrekCCLSn9nmbmhnGZ1HUlxN8zY-O3bs7jxQ/exec?page=Login"
                allow="geolocation; camera; microphone; fullscreen"
                allowfullscreen
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>
    </div>

    <script>
        // ============================
        // CONFIGURATION
        // ============================
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwSM25ObtDe_AwvXut2QqGjfc9-v-3I2xsrekCCLSn9nmbmhnGZ1HUlxN8zY-O3bs7jxQ/exec';
        const LOGIN_URL = WEB_APP_URL + '?page=Login';
        const SURVEY_URL = WEB_APP_URL; // Default page = Survey/Index

        // ============================
        // STATE
        // ============================
        let currentPage = 'login';

        // ============================
        // ELEMENTS
        // ============================
        const frame = document.getElementById('surveyFrame');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');
        const topBanner = document.getElementById('topBanner');
        const currentPageLabel = document.getElementById('currentPageLabel');

        // ============================
        // LOADER CONTROL
        // ============================
        function showLoader(text) {
            loaderText.textContent = text || 'Loading…';
            loader.classList.remove('hidden');
            loader.style.display = 'flex';
        }

        function hideLoader() {
            loader.classList.add('hidden');
            setTimeout(() => {
                if (loader.classList.contains('hidden')) {
                    loader.style.display = 'none';
                }
            }, 500);
        }

        // ============================
        // PAGE SWITCHING
        // ============================
        function showLogin() {
            currentPage = 'login';
            document.body.classList.add('login-mode');
            showLoader('Loading Login…');
            frame.src = LOGIN_URL;
        }

        function showSurvey() {
            currentPage = 'survey';
            document.body.classList.remove('login-mode');
            currentPageLabel.textContent = 'Survey';
            showLoader('Loading Survey…');
            frame.src = SURVEY_URL;
        }

        // ============================
        // LOGOUT
        // ============================
        function logout() {
            if (!confirm('Are you sure you want to logout?')) return;

            // Clear localStorage in wrapper
            localStorage.removeItem('bvm_user_token');
            localStorage.removeItem('bvm_user_role');
            localStorage.removeItem('bvm_user_name');
            localStorage.removeItem('bvm_user_email');

            // Tell iframe to logout (if possible)
            try {
                frame.contentWindow.postMessage({ action: 'logout' }, '*');
            } catch (e) {
                console.log('PostMessage failed:', e);
            }

            // Show login page
            showLogin();
        }

        // ============================
        // MESSAGE LISTENER (from iframe)
        // ============================
        window.addEventListener('message', function(event) {
            const data = event.data;
            if (!data || typeof data !== 'object') return;

            console.log('📨 Message from iframe:', data);

            switch (data.action) {
                case 'login-success':
                    console.log('✅ Login success — switching to survey');
                    showSurvey();
                    break;

                case 'logout':
                    console.log('👋 Logout from iframe');
                    showLogin();
                    break;

                case 'navigate':
                    if (data.page === 'login') showLogin();
                    if (data.page === 'survey') showSurvey();
                    break;

                case 'page-loaded':
                    console.log('📄 Page loaded:', data.page);
                    if (data.page === 'login') {
                        currentPage = 'login';
                        document.body.classList.add('login-mode');
                    } else {
                        currentPage = 'survey';
                        document.body.classList.remove('login-mode');
                        currentPageLabel.textContent = data.page || 'Survey';
                    }
                    hideLoader();
                    break;
            }
        });

        // ============================
        // IFRAME LOAD HANDLER
        // ============================
        frame.addEventListener('load', function() {
            // Small delay to let iframe render
            setTimeout(hideLoader, 300);
        });

        // Safety fallback: hide after 5s
        setTimeout(hideLoader, 5000);

        // ============================
        // INIT
        // ============================
        // Check if user already has a valid session in localStorage
        (function init() {
            const existingToken = localStorage.getItem('bvm_user_token');

            if (existingToken) {
                console.log('📦 Found existing session — going to survey');
                showSurvey();
            } else {
                console.log('🔐 No session — showing login');
                showLogin();
            }
        })();

    </script>
</body>
</html>
